<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cybersecurity Chatbot</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="chat-container">
    <h2>Cybersecurity Chatbot 🔐</h2>
    <div id="chat-box"></div>
    <input type="text" id="question-input" placeholder="Ask a cybersecurity question..." />
    <button onclick="sendQuestion()">Send</button>
  </div>

  <script>
    async function sendQuestion() {
      const input = document.getElementById("question-input");
      const chatBox = document.getElementById("chat-box");
      const question = input.value.trim();

      if (!question) return;

      chatBox.innerHTML += `<div class='user-msg'>You: ${question}</div>`;
      input.value = "";

      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question })
      });

      const data = await res.json();
      chatBox.innerHTML += `<div class='bot-msg'>Bot: ${data.answer}</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
